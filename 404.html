<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Giocapo · Registro</title>
</head>
<body>
<p id="message">Verificando endereço do registro...</p>
<script>
const match=/^\/LOG\d{12}\/?$/.exec(location.pathname);
if(match){location.replace('/?auditRoute='+encodeURIComponent(location.pathname.replaceAll('/','')))}
else{document.getElementById('message').textContent='Página não encontrada.'}
</script>
</body>
</html>
